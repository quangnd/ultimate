name: windows

on:
  push:
    branches: [main, 'windows/**', 'ultimate/**']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ULTIMATE_SMOKE_LOG: ${{ runner.temp }}/smoke.log
    steps:
      - uses: actions/checkout@v4
      - run: git config --global core.longpaths true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Doctor (information only)
        continue-on-error: true
        run: node scripts/windows-doctor.ts
      - name: Smoke (the gate)
        run: node scripts/windows-smoke.ts
      - name: Fast test suite (information only)
        if: always()
        continue-on-error: true
        run: pnpm exec vp test --maxWorkers=2
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke.log*
          if-no-files-found: ignore
